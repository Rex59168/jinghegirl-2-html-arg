<div id="app" hidden>

    cases: [

  guard.enter({}, () => {
    chrome.mountBare();

    function render() {
      document.getElementById('main').replaceChildren(
        renderWorksheet(PAGE, store.get('locale'), () => {
          notebook.addFact('worksheet-solved', t(WORKSHEET_SOLVED_FACT, store.get('locale')), 'worksheet.html');
        })
      );
    }
    render();
    chrome.onLocaleChange(render);
  });
</script>
</body>
</html>
