<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>關於我們｜社團法人臺灣失蹤兒少協尋關懷基金會</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/endgame.css">
</head>
<body>

<div id="content-warning" class="content-warning" hidden>
  <div class="content-warning__box">
    <h1 class="content-warning__title"></h1>
    <p class="content-warning__body"></p>
    <button type="button" class="content-warning__continue"></button>
    <div class="lang-switcher" id="lang-switcher-warning"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="site-header">
    <span class="site-header__name"></span>
    <a class="site-header__donate" href="javascript:void(0)"></a>
  </header>
  <nav class="site-nav" id="site-nav"></nav>
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <main id="main"></main>
  <div class="lang-switcher" id="lang-switcher"></div>
  <footer class="site-footer" id="site-footer"></footer>
</div>

<script type="module">
  import { store } from './scripts/store.js';
  import * as guard from './scripts/guard.js';
  import * as chrome from './scripts/chrome.js';
  import { renderAbout, homeCrumb } from './scripts/render.js';
  import { LABELS } from './scripts/labels.js';
  import { t } from './scripts/i18n.js';

  const PAGE = {
    title: { "zh-Hant": "關於我們", "zh-Hans": "关于我们", en: "About Us" },
    introTitle: { "zh-Hant": "本會簡介", "zh-Hans": "本会简介", en: "Foundation Overview" },
    introBody: { "zh-Hant": "社團法人臺灣失蹤兒少協尋關懷基金會成立於民國一百年，由數個地方協尋團體整合而成，致力於協助失蹤兒童及少年家庭進行協尋登記、資料建置與後續關懷服務。", "zh-Hans": "社团法人台湾失踪儿少协寻关怀基金会成立于民国一百年，由数个地方协寻团体整合而成，致力于协助失踪儿童及少年家庭进行协寻登记、资料建置与后续关怀服务。", en: "The Taiwan Missing Children & Youth Search and Care Foundation was established in ROC year 100 (2011), formed from the merger of several regional search groups. It assists families of missing children and youth with case registration, record-keeping, and follow-up care." },
    orgStats: [
      { icon: "building", value: { "zh-Hant": "15 年", "zh-Hans": "15 年", en: "15 yrs" }, label: { "zh-Hant": "成立至今", "zh-Hans": "成立至今", en: "Years in operation" } },
      { icon: "users", value: { "zh-Hant": "42 人", "zh-Hans": "42 人", en: "42" }, label: { "zh-Hant": "登記志工", "zh-Hans": "登记志工", en: "Registered volunteers" } },
      { icon: "document", value: "20", label: { "zh-Hant": "累計受理案件", "zh-Hans": "累计受理案件", en: "Cases filed to date" } },
      { icon: "shield", value: { "zh-Hant": "3 縣市", "zh-Hans": "3 县市", en: "3" }, label: { "zh-Hant": "服務區域", "zh-Hans": "服务区域", en: "Service areas" } }
    ],
    servicesTitle: { "zh-Hant": "服務項目", "zh-Hans": "服务项目", en: "Services" },
    services: [
      { "zh-Hant": "協尋案件受理與建檔", "zh-Hans": "协寻案件受理与建档", en: "Search case intake and filing" },
      { "zh-Hant": "案件狀態更新公告", "zh-Hans": "案件状态更新公告", en: "Case status update announcements" },
      { "zh-Hant": "家屬關懷服務轉介", "zh-Hans": "家属关怀服务转介", en: "Referral for family support services" },
      { "zh-Hant": "年度捐款徵信公告", "zh-Hans": "年度捐款征信公告", en: "Annual donation disclosure" },
      { "zh-Hant": "志工教育訓練", "zh-Hans": "志工教育训练", en: "Volunteer training programs" },
      { "zh-Hant": "社區協尋宣導活動", "zh-Hans": "社区协寻宣导活动", en: "Community search-awareness outreach" }
    ],
    history: [
      { year: "民國 100 年", text: { "zh-Hant": "由數個地方協尋團體整合成立，設立尋人資料庫雛形。", "zh-Hans": "由数个地方协寻团体整合成立，设立寻人数据库雏形。", en: "Founded from the merger of several regional search groups; the missing-persons database takes shape." } },
      { year: "民國 104 年", text: { "zh-Hant": "登記為社團法人，服務範圍擴及鄰近縣市。", "zh-Hans": "登记为社团法人，服务范围扩及邻近县市。", en: "Registered as a formal association; service area expands to neighboring counties." } },
      { year: "民國 109 年", text: { "zh-Hant": "捐款徵信改採匿名揭露方式，僅公布郵遞區號。", "zh-Hans": "捐款征信改采匿名揭露方式，仅公布邮递区号。", en: "Donation disclosure switches to anonymous format, listing only postal codes." } },
      { year: "民國 115 年", text: { "zh-Hant": "尋人資料庫網站改版，案件查詢介面更新。", "zh-Hans": "寻人数据库网站改版，案件查询界面更新。", en: "The missing-persons database website is redesigned, with an updated case-lookup interface." } }
    ],
    hoursTitle: { "zh-Hant": "服務時間", "zh-Hans": "服务时间", en: "Office Hours" },
    hoursBody: { "zh-Hant": "週一至週五 09:00–17:00（國定假日休館）。本會恕不提供臨櫃服務，如需申請協尋登記請使用線上表單。", "zh-Hans": "周一至周五 09:00–17:00（国定假日休馆）。本会恕不提供临柜服务，如需申请协寻登记请使用线上表单。", en: "Monday–Friday, 09:00–17:00 (closed on national holidays). This foundation does not offer in-person counter service; please use the online form to register a search case." }
  };

  guard.enter({}, () => {
    chrome.mount({ breadcrumb: [homeCrumb(store.get('locale')), t(LABELS.navAbout, store.get('locale'))] });
    function render() {
      document.getElementById('main').replaceChildren(renderAbout(PAGE, store.get('locale')));
    }
    render();
    chrome.onLocaleChange(render);
  });
</script>
</body>
</html>
