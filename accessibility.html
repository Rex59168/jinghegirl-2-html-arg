<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無障礙宣告｜社團法人臺灣失蹤兒少協尋關懷基金會</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/endgame.css">
</head>
<body>

<div id="content-warning" class="content-warning" hidden>
  <div class="content-warning__box">
    <h1 class="content-warning__title"></h1>
    <p class="content-warning__body"></p>
    <button type="button" class="content-warning__continue"></button>
    <div class="lang-switcher" id="lang-switcher-warning"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="site-header">
    <span class="site-header__name"></span>
    <a class="site-header__donate" href="javascript:void(0)"></a>
  </header>
  <nav class="site-nav" id="site-nav"></nav>
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <main id="main"></main>
  <div class="lang-switcher" id="lang-switcher"></div>
  <footer class="site-footer" id="site-footer"></footer>
</div>

<script type="module">
  import { store } from './scripts/store.js';
  import * as guard from './scripts/guard.js';
  import * as chrome from './scripts/chrome.js';
  import { renderAccessibility, homeCrumb } from './scripts/render.js';
  import { LABELS } from './scripts/labels.js';
  import { t } from './scripts/i18n.js';

  const PAGE = {
    title: { "zh-Hant": "無障礙宣告", "zh-Hans": "无障碍宣告", en: "Accessibility Statement" },
    body: [
      { "zh-Hant": "本網站依網站無障礙開發規範，通過 AA 檢測等級。", "zh-Hans": "本网站依网站无障碍开发规范，通过 AA 检测等级。", en: "This website has been developed in accordance with web accessibility guidelines and conforms to Level AA." },
      { "zh-Hant": "建議使用 Chrome、Edge、Firefox、Safari 最新版本瀏覽本網站。", "zh-Hans": "建议使用 Chrome、Edge、Firefox、Safari 最新版本浏览本网站。", en: "For the best experience, please use the latest version of Chrome, Edge, Firefox, or Safari." },
      { "zh-Hant": "如您在使用本網站時遭遇無障礙相關問題，歡迎透過「聯絡我們」頁面與本會聯繫。", "zh-Hans": "如您在使用本网站时遭遇无障碍相关问题，欢迎透过「联络我们」页面与本会联系。", en: "If you encounter any accessibility issues while using this website, please contact us via the \"Contact\" page." }
    ]
  };

  guard.enter({}, () => {
    chrome.mount({ breadcrumb: [homeCrumb(store.get('locale')), t(LABELS.navAccessibility, store.get('locale'))] });
    function render() {
      document.getElementById('main').replaceChildren(renderAccessibility(PAGE, store.get('locale')));
    }
    render();
    chrome.onLocaleChange(render);
  });
</script>
</body>
</html>
