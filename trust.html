<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歷年徵信錄｜社團法人臺灣失蹤兒少協尋關懷基金會</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/endgame.css">
</head>
<body>

<div id="content-warning" class="content-warning" hidden>
  <div class="content-warning__box">
    <h1 class="content-warning__title"></h1>
    <p class="content-warning__body"></p>
    <button type="button" class="content-warning__continue"></button>
    <div class="lang-switcher" id="lang-switcher-warning"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="site-header">
    <span class="site-header__name"></span>
    <a class="site-header__donate" href="javascript:void(0)"></a>
  </header>
  <nav class="site-nav" id="site-nav"></nav>
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <main id="main"></main>
  <div class="lang-switcher" id="lang-switcher"></div>
  <footer class="site-footer" id="site-footer"></footer>
</div>

<script type="module">
  import { store } from './scripts/store.js';
  import * as guard from './scripts/guard.js';
  import * as chrome from './scripts/chrome.js';
  import { renderTrust, homeCrumb } from './scripts/render.js';
  import { LABELS } from './scripts/labels.js';
  import { t } from './scripts/i18n.js';
  import * as flags from './scripts/flags.js';
  import * as notebook from './scripts/notebook.js';
  import * as mail from './scripts/mail.js';

  const ANON = { "zh-Hant": "無名氏", "zh-Hans": "无名氏", en: "Anonymous" };
  const DASH = { "zh-Hant": "—", "zh-Hans": "—", en: "—" };
  const ZIP = {
    hedong: { "zh-Hant": "「河東區郵遞區號」", "zh-Hans": "「河东区邮递区号」", en: "[Hedong District postal code]" },
    hexi: { "zh-Hant": "「河西區郵遞區號」", "zh-Hans": "「河西区邮递区号」", en: "[Hexi District postal code]" },
    zhongshan: { "zh-Hant": "「中山區郵遞區號」", "zh-Hans": "「中山区邮递区号」", en: "[Zhongshan District postal code]" },
    datong: { "zh-Hant": "「大同區郵遞區號」", "zh-Hans": "「大同区邮递区号」", en: "[Datong District postal code]" }
  };
  function anon(zip) {
    return { name: ANON, zip };
  }
  function named(name) {
    return { name, zip: DASH };
  }

  const PAGE = {
    title: { "zh-Hant": "歷年徵信錄", "zh-Hans": "历年征信录", en: "Historical Donor Disclosure" },
    note: { "zh-Hant": "本會依規定公布捐款徵信，此頁彙整歷年紀錄。匿名捐款者僅列郵遞區號以利收據寄送。", "zh-Hans": "本会依规定公布捐款征信，此页汇整历年记录。匿名捐款者仅列邮递区号以利收据寄送。", en: "This foundation publishes donation disclosures as required; this page compiles records across years. Anonymous donors are listed only by postal code for receipt mailing purposes." },
    rows: [
      { date: "03/12", year: "2019", amount: "500", ...named("王○成") },
      { date: "05/20", year: "2019", amount: "2,000", ...named("○○早餐店") },
      { date: "07/09", year: "2019", amount: "800", ...anon(ZIP.zhongshan) },
      { date: "11/03", year: "2019", amount: "1,500", ...named("陳○婷") },

      { date: "02/18", year: "2020", amount: "2,000", ...anon(ZIP.datong) },
      { date: "04/22", year: "2020", amount: "3,000", ...named("林○賢") },
      { date: "09/10", year: "2020", amount: "500", ...named("○○機車行") },
      { date: "12/05", year: "2020", amount: "1,200", ...anon(ZIP.hexi) },

      { date: "01/30", year: "2021", amount: "800", ...named("黃○婷") },
      { date: "06/14", year: "2021", amount: "2,500", ...anon(ZIP.zhongshan) },
      { date: "08/09", year: "2021", amount: "5,000", ...named("○○診所") },
      { date: "10/27", year: "2021", amount: "500", ...named("吳○宏") },

      { date: "02/11", year: "2022", amount: "1,800", ...anon(ZIP.datong) },
      { date: "06/03", year: "2022", amount: "2,000", ...named("張○芸") },
      { date: "09/03", year: "2022", amount: "1,000", ...anon(ZIP.hedong) },
      { date: "11/19", year: "2022", amount: "500", ...named("○○洗衣店") },

      { date: "01/08", year: "2023", amount: "3,000", ...anon(ZIP.hexi) },
      { date: "05/22", year: "2023", amount: "1,500", ...named("郭○豪") },
      { date: "08/17", year: "2023", amount: "800", ...named("曾○妍") },
      { date: "12/02", year: "2023", amount: "2,200", ...anon(ZIP.zhongshan) },

      { date: "03/09", year: "2024", amount: "500", ...named("賴○翰") },
      { date: "07/14", year: "2024", amount: "1,600", ...anon(ZIP.datong) },
      { date: "09/25", year: "2024", amount: "3,500", ...named("○○補習班") },
      { date: "11/30", year: "2024", amount: "800", ...named("潘○維") },

      { date: "02/14", year: "2025", amount: "2,000", ...anon(ZIP.hexi) },
      { date: "05/01", year: "2025", amount: "1,200", ...named("蕭○安") },
      { date: "08/14", year: "2025", amount: "1,000", ...anon(ZIP.hedong) },
      { date: "10/06", year: "2025", amount: "500", ...named("洪○宇") },

      { date: "01/15", year: "2026", amount: "2,800", ...anon(ZIP.zhongshan) },
      { date: "04/20", year: "2026", amount: "1,500", ...named("王○穎") },
      { date: "08/26", year: "2026", amount: "1,000", ...anon(ZIP.hedong) },
      { date: "09/10", year: "2026", amount: "500", ...named("○○文具行") }
    ]
  };

  const TRUST_SEEN_FACT = { "zh-Hant": "歷年徵信錄：三筆匿名捐款，金額都一樣，日期不同。", "zh-Hans": "历年征信录：三笔匿名捐款，金额都一样，日期不同。", en: "Historical donor disclosure: three anonymous donations, same amount, different dates." };

  const HINT_LETTER = {
    subject: { "zh-Hant": "這份徵信錄有點奇怪", "zh-Hans": "这份征信录有点奇怪", en: "Something's off about this disclosure" },
    body: { "zh-Hant": "三筆匿名捐款，金額一模一樣，日期卻分散在完全不同的年份。你要不要拿去跟資料庫裡的失蹤日期核對看看？我做了一張簡單的比對表，你可以用用看。", "zh-Hans": "三笔匿名捐款，金额一模一样，日期却分散在完全不同的年份。你要不要拿去跟数据库里的失踪日期核对看看？我做了一张简单的比对表，你可以用用看。", en: "Three anonymous donations, identical amounts, but the dates are scattered across completely different years. Why not check them against the missing-persons dates in the database? I put together a simple comparison worksheet — feel free to use it." },
    linkLabel: { "zh-Hant": "開啟比對表", "zh-Hans": "打开比对表", en: "Open the worksheet" }
  };

  guard.enter({}, () => {
    chrome.mount({ breadcrumb: [homeCrumb(store.get('locale')), t(LABELS.trustBreadcrumb, store.get('locale'))] });
    flags.notePageSeen('page-trust');
    notebook.addFact('trust-seen', t(TRUST_SEEN_FACT, store.get('locale')), 'trust.html');
    mail.deliverLetter('trust-hint', { ...HINT_LETTER, linkHref: 'worksheet.html' }, store.get('locale'));

    function render() {
      document.getElementById('main').replaceChildren(renderTrust(PAGE, store.get('locale')));
    }
    render();
    chrome.onLocaleChange(render);
  });
</script>
</body>
</html>
