<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<title>對話記錄・再讀一次</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/browser-chrome.css">
<link rel="stylesheet" href="assets/css/widgets.css">
<link rel="stylesheet" href="assets/css/site-chat.css">
</head>
<body class="site-chat" data-requires="ch4_done">

<header class="chat-head">
  <h1>@rec_1029</h1>
  <div class="sub">一模一樣的對話記錄,一個字都沒改</div>
</header>

<div class="tag-legend" id="tag-legend"></div>
<div class="chat-thread" id="thread"></div>

<div class="tag-check-bar">
  <span id="tag-count">0 / 12 標對了</span>
  <button type="button" id="check-btn">檢查標註</button>
</div>

<div class="reveal-block" id="reveal-block" style="display:none;"></div>

<script src="assets/js/state.js"></script>
<script src="assets/js/entry-warning.js"></script>
<script src="assets/js/chapter-guard.js"></script>
<script src="assets/js/t2s-map.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/browser-chrome.js"></script>
<script src="assets/js/notebook.js"></script>
<script src="assets/js/hint.js"></script>
<script src="assets/js/ambient.js"></script>
<script src="assets/js/idle-scroll.js"></script>
<script>
JHPhone.push("open_threadreview", "我們再讀一次,這次試著看懂他在做什麼。");
</script>
<script>
const CATEGORIES = [
  { id: 1, label: "試探家庭狀況", color: "#c0392b" },
  { id: 2, label: "確認有無人會找", color: "#8e44ad" },
  { id: 3, label: "建立獨佔感", color: "#2980b9" },
  { id: 4, label: "製造時間壓力", color: "#d35400" },
  { id: 5, label: "測試底線", color: "#16a085" },
  { id: 6, label: "轉移地點", color: "#6b6f76" },
];
function catOf(tagId) { return Math.ceil(tagId / 2); }
function catInfo(catId) { return CATEGORIES.find((c) => c.id === catId); }

let ALL = [];
let playerTags = JH.get("ch5_tags", {});
let activeMsgId = null;

const legend = document.getElementById("tag-legend");
CATEGORIES.forEach((c) => {
  const span = document.createElement("span");
  span.className = "legend-chip";
  span.style.background = c.color;
  span.textContent = c.label;
  legend.appendChild(span);
});

fetch("assets/data/chat-thread.json")
  .then((r) => r.json())
  .then((data) => {
    ALL = [].concat(data.before, data.reorder, data.after);
    renderThread();
    updateCount();
  });

function renderThread() {
  const el = document.getElementById("thread");
  el.innerHTML = "";
  ALL.forEach((m) => el.appendChild(bubble(m)));
}

function bubble(m) {
  const div = document.createElement("div");
  div.className = "chat-msg " + m.who + (m.tag ? " taggable" : "");
  const myTag = playerTags[m.id];
  const chip = myTag ? `<span class="tag-chip" style="background:${catInfo(myTag).color}">${catInfo(myTag).label}</span><br>` : "";
  div.innerHTML = `${chip}${m.edited ? '<span class="edited-badge">已編輯</span>' : ""}${escapeHtml(m.text)}<span class="time">${m.time}</span>`;
  if (m.tag) {
    div.addEventListener("click", () => openSheet(m));
  }
  return div;
}
function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// bottom sheet
const backdrop = document.createElement("div");
backdrop.className = "tag-sheet-backdrop";
const sheet = document.createElement("div");
sheet.className = "tag-sheet";
document.body.appendChild(backdrop);
document.body.appendChild(sheet);
backdrop.addEventListener("click", closeSheet);

function openSheet(m) {
  activeMsgId = m.id;
  sheet.innerHTML = `
    <div class="quote">「<span>${escapeHtml(m.text)}</span>」</div>
    ${CATEGORIES.map((c) => `<button type="button" class="tag-option" data-cat="${c.id}" style="background:${c.color}">${c.label}</button>`).join("")}
    <button type="button" class="tag-clear" id="tag-clear">移除標籤</button>
  `;
  sheet.querySelectorAll(".tag-option").forEach((btn) => {
    btn.addEventListener("click", () => {
      playerTags[activeMsgId] = parseInt(btn.dataset.cat, 10);
      JH.set("ch5_tags", playerTags);
      renderThread();
      updateCount();
      closeSheet();
    });
  });
  document.getElementById("tag-clear").addEventListener("click", () => {
    delete playerTags[activeMsgId];
    JH.set("ch5_tags", playerTags);
    renderThread();
    updateCount();
    closeSheet();
  });
  backdrop.classList.add("open");
  sheet.classList.add("open");
}
function closeSheet() {
  backdrop.classList.remove("open");
  sheet.classList.remove("open");
}

function updateCount() {
  const signal = ALL.filter((m) => m.tag);
  const correct = signal.filter((m) => playerTags[m.id] === catOf(m.tag)).length;
  document.getElementById("tag-count").textContent = `${correct} / ${signal.length} 標對了`;
  return correct;
}

document.getElementById("check-btn").addEventListener("click", () => {
  const correct = updateCount();
  if (correct >= 9) {
    completeChapter(correct);
  } else {
    document.getElementById("tag-count").textContent += "・再想想看";
  }
});

function completeChapter(correct) {
  JH.set("ch5_done", true);
  JHNotebook.add("ch5_tags", `重讀對話,標對 ${correct}/12 句誘導語句`, "chat/thread-review.html");
  JHNotebook.add("ch5_mutual", "那兩個共同好友帳號,標點習慣跟錯字模式都跟 @rec_1029 一致——是同一個人", "chat/thread-review.html");
  JHNotebook.add("ch5_delay", "他每次回覆間隔 8–12 分鐘,不是在忙,是刻意延遲,製造他不是隨時在等妳的錯覺", "chat/thread-review.html");
  JHPhone.push("nudge_ch6", "這次妳應該看懂了。我這邊還有一個東西給妳看。", "files/collection.html");

  const block = document.getElementById("reveal-block");
  block.style.display = "block";
  block.innerHTML = `
    <p>你標對了 ${correct}/12 句。</p>
    <p>那兩個「共同好友」帳號,發文時間、標點習慣(全形驚嘆號)、錯字模式,跟 @rec_1029 完全一致——是同一個人。</p>
    <p>你有沒有發現,他每次回覆的間隔,幾乎都精準落在 8 到 12 分鐘之間?他不是在忙。他是在刻意延遲,製造「他不是隨時在等妳」的錯覺。</p>
    <p style="text-align:center;margin-top:16px;"><a href="files/collection.html" style="color:#9fc7ff;">他的收藏資料夾 →</a></p>
  `;
  block.scrollIntoView({ behavior: "smooth" });
}

if (JH.get("ch5_done")) {
  setTimeout(() => completeChapter(updateCount()), 300);
}
</script>
</body>
</html>
