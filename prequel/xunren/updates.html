<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>已釐清事項 | 協尋林晞</title>
<link rel="stylesheet" href="assets/css/base.css">

<body class="site-xunren">

<header class="xunren-head">
  <h1>已釐清事項</h1>
  <div class="sub">周妤持續更新</div>
</header>

<main class="container">
  <section class="panel" id="updates-list">
    <h2>公告</h2>
  </section>

  <p style="text-align:center;"><a href="index.html">← 回協尋站首頁</a></p>
</main>

<script src="assets/js/state.js"></script>
<script src="assets/js/entry-warning.js"></script>
<script src="assets/js/chapter-guard.js"></script>
<script src="assets/js/t2s-map.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/browser-chrome.js"></script>
<script src="assets/js/notebook.js"></script>
<script src="assets/js/hint.js"></script>
<script src="assets/js/ambient.js"></script>
<script>
const items = [
  { key: "always", date: "8/15", text: "建站。官方公告最後聯繫時間為 17:32。" },
  { key: "ch0_done", date: "8/16", text: "已確認最後聯繫時間其實是 19:41,非先前公告之 17:32。" },
  { key: "ch1_done", date: "8/17", text: "晞晞在找一張光碟,只知道編號開頭是 #18_。她房間的相簿裡藏著這條線索,不知道她自己有沒有發現。" },
  { key: "ch2_done", date: "8/19", text: "確認編號是 #188。這份光碟從 2023/11/06 掛在二手平台上,兩年沒人動過,留言 47 則,賣家一則都沒回——直到今年七月。" },
  { key: "ch3_done", date: "8/21", text: "拿到完整對話記錄。他們約在 8/14 文昌站見面,原本 16:00,後來他說塞車改成 17:30。" },
  { key: "ch4_done", date: "8/24", text: "重建了 8/14 那一天。她做對了五件事——約在白天、約在公共場所、查過他的帳號、跟我說了、也開了定位分享。她還是出事了。" },
  { key: "ch5_done", date: "8/26", text: "重讀了一次對話,這次看懂了。那兩個共同好友帳號其實是同一個人假扮的。" },
  { key: "ch6_done", date: "8/28", text: "看到他的收藏資料夾了。我不知道該說什麼。" },
  { key: "news_done", date: "8/31", text: "河堤那具遺骸,確認是林昭。我一直在想,如果我早一點意識到晞晞在做什麼就好了。" },
];

const list = document.getElementById("updates-list");
items.forEach((it) => {
  if (it.key !== "always" && !JH.get(it.key)) return;
  const div = document.createElement("div");
  div.className = "update-item";
  div.innerHTML = `<span class="date">${it.date} 更新</span>${it.text}`;
  list.appendChild(div);
});

if (JH.get("ch3_done") && !JH.get("ch4_done")) {
  const div = document.createElement("div");
  div.className = "update-item";
  div.innerHTML = '<span class="date"></span><a href="xunren/rebuild-0814.html">→ 繼續:重建 8/14 那一天</a>';
  list.appendChild(div);
}

if (JH.get("ch4_done") && !JH.get("ch5_done")) {
  const div = document.createElement("div");
  div.className = "update-item";
  div.innerHTML = '<span class="date"></span><a href="chat/thread-review.html">→ 繼續:再讀一次那份對話</a>';
  list.appendChild(div);
}

if (JH.get("ch5_done") && !JH.get("ch6_done")) {
  const div = document.createElement("div");
  div.className = "update-item";
  div.innerHTML = '<span class="date"></span><a href="files/collection.html">→ 繼續:他的收藏資料夾</a>';
  list.appendChild(div);
}

if (JH.get("ch6_done") && !JH.get("news_done")) {
  const div = document.createElement("div");
  div.className = "update-item";
  div.innerHTML = '<span class="date"></span><a href="news/report.html">→ 看一則新聞</a>';
  list.appendChild(div);
}

if (JH.get("news_done")) {
  const div = document.createElement("div");
  div.className = "update-item";
  div.innerHTML = '<span class="date"></span><a href="ending/index.html">→ 最新進度</a>';
  list.appendChild(div);
}
</script>
</body>
</html>
