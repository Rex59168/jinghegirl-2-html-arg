<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<title>更正資訊 | 協尋林晞</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/browser-chrome.css">
<link rel="stylesheet" href="assets/css/widgets.css">
<link rel="stylesheet" href="assets/css/site-xunren.css">
</head>
<body class="site-xunren">

<header class="xunren-head">
  <h1>更正資訊</h1>
  <div class="sub">協尋林晞・回報表單</div>
</header>

<main class="container">
  <div id="form-view">
    <section class="panel">
      <h2>在你送出之前</h2>
      <p style="font-size:14px;">
        我需要知道是誰在幫忙、還有你是怎麼找到這裡的——之後如果有進展,我才知道要通知誰。
      </p>
      <form id="correction-form">
        <label for="nickname">你的暱稱</label>
        <input type="text" id="nickname" required maxlength="30">

        <label for="howknown">你是怎麼知道這件事的?</label>
        <input type="text" id="howknown" required maxlength="80" placeholder="例如:朋友分享連結">

        <label for="answer">正確的最後動態時間(24小時制,例如 19:41)</label>
        <input type="text" id="answer" required maxlength="10" placeholder="19:41">

        <p class="err" id="err"></p>
        <p><button type="submit" class="btn">送出更正</button></p>
      </form>
    </section>
  </div>

  <div id="success-view" class="panel" style="display:none;">
    <h2>已收到,謝謝你</h2>
    <p id="zy-msg1">……妳說得對,我剛剛又去看了一次,真的是 19:41。我已經把公告改了。</p>
    <p id="zy-msg2" style="display:none;">
      對了——我把她雲端相簿的密碼傳給你了:<strong>linxi0417</strong><br>
      我一直沒敢自己點進去看,你能不能幫我看看裡面有沒有什麼?
    </p>
    <p id="zy-link" style="display:none;"><a class="btn" href="editor/album.html">前往她的雲端相簿 →</a></p>
  </div>

  <p style="text-align:center;margin-top:20px;">
    <a href="home.html">← 回協尋站首頁</a>
  </p>
</main>

<script src="assets/js/state.js"></script>
<script src="assets/js/entry-warning.js"></script>
<script src="assets/js/chapter-guard.js"></script>
<script src="assets/js/t2s-map.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/browser-chrome.js"></script>
<script src="assets/js/notebook.js"></script>
<script src="assets/js/hint.js"></script>
<script src="assets/js/ambient.js"></script>
<script>
const ANSWER_HASH = "d5f915e54b6d7737c3d9a036dfe547944879b65b3b72e0e6a44f21ba62dac1ef"; // sha256("19:41")

document.getElementById("correction-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nickname = document.getElementById("nickname").value.trim();
  const howknown = document.getElementById("howknown").value.trim();
  const answer = document.getElementById("answer").value;
  const errEl = document.getElementById("err");

  const ok = await JH.checkAnswer(answer, ANSWER_HASH);
  if (!ok) {
    errEl.textContent = "時間好像不太對,你再確認一次她最後一則動態的時間戳。";
    return;
  }
  errEl.textContent = "";

  JH.set("nickname", nickname);
  JH.set("how_known", howknown);
  JH.set("ch0_done", true);

  JHNotebook.add(
    "ch0_answer",
    "最後訊號其實是 19:41(原公告寫 17:32)",
    "xunren/correction.html"
  );

  document.getElementById("form-view").style.display = "none";
  document.getElementById("success-view").style.display = "block";
  setTimeout(() => (document.getElementById("zy-msg2").style.display = "block"), 900);
  setTimeout(() => (document.getElementById("zy-link").style.display = "block"), 1600);
  setTimeout(() => JHPhone.push("nudge_ch1", "密碼傳給你了,先去看看她的相簿。", "editor/album.html"), 2200);
});
</script>
</body>
</html>
