<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<title>更正資訊 | 協尋林晞</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/browser-chrome.css">
<link rel="stylesheet" href="assets/css/widgets.css">
<link rel="stylesheet" href="assets/css/site-xunren.css">
<link rel="stylesheet" href="assets/css/clue-system.css">
</head>
<body class="site-xunren">

<header class="xunren-head">
  <h1>更正資訊</h1>
  <div class="sub">協尋林晞・回報表單</div>
</header>

<main class="container">
  <div id="form-view">
    <section class="panel">
      <h2>更正時間戳</h2>
      <p>請提供妳認為和「她最後一次上線的正確時間」有關的線索。</p>
      <div id="clue-root"></div>
    </section>
  </div>

  <div id="success-view" class="panel" style="display:none;">
    <h2>已收到,謝謝你</h2>
    <p>我們已經收到你提供的更正資訊,協尋公告會盡快更新。</p>
  </div>

  <p style="text-align:center;margin-top:20px;">
    <a href="home.html">← 回協尋站首頁</a>
  </p>
</main>

<script src="assets/js/state.js"></script>
<script src="assets/js/entry-warning.js"></script>
<script src="assets/js/chapter-guard.js"></script>
<script src="assets/js/t2s-map.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/browser-chrome.js"></script>
<script src="assets/js/notebook.js"></script>
<script src="assets/js/hint.js"></script>
<script src="assets/js/ambient.js"></script>
<script src="assets/js/clue-system.js"></script>
<script>
// 這裡不再用文字輸入+雜湊比對的方式驗證答案——玩家要從自己已經蒐集到的
// 線索裡挑出正確的那一則交出來。expectedId 對應的是 social/lin-xi.html
// 看完限時動態最後一則時,JHNotebook.add("ch0_story4_seen", ...) 記下的那筆
// 線索,玩家得先真的去看過那則動態、蒐集到這則線索,才交得出來。
JHClueSystem.mount({
  root: document.getElementById("clue-root"),
  expectedId: "ch0_story4_seen",
  wrongMessage: "這則線索好像跟她最後上線的時間沒有關係。",
  onCorrect: () => {
    JH.set("ch0_done", true);

    JHNotebook.add(
      "ch0_answer",
      "最後訊號其實是 19:41(原公告寫 17:32)",
      "xunren/correction.html"
    );

    document.getElementById("form-view").style.display = "none";
    document.getElementById("success-view").style.display = "block";
    JHPhone.push("ch0_zy_msg1", "……妳說得對,我剛剛又去看了一次,真的是 19:41。我已經把公告改了。");
    setTimeout(() => {
      // 密碼本身是純文字,不能整則都點得進去——不然玩家會分不清楚這則訊息是
      // 「告訴你密碼」還是「點這裡進去」。連結另外用下一則訊息傳,才是真正
      // 點進雲端相簿的入口。
      JHPhone.push(
        "ch0_zy_msg2",
        "對了——我把她雲端相簿的密碼傳給妳了:linxi0417。我一直沒敢自己點進去看,妳能不能幫我看看裡面有沒有什麼?"
      );
    }, 900);
    setTimeout(() => {
      JHPhone.push("ch0_zy_msg3", "連結我也傳給妳了,妳自己點進去看。", "editor/album.html");
    }, 1500);
  },
});
</script>
</body>
</html>
