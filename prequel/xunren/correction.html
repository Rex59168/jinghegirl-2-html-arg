<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<title>聯絡站長 | 協尋林晞</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/browser-chrome.css">
<link rel="stylesheet" href="assets/css/widgets.css">
<link rel="stylesheet" href="assets/css/site-xunren.css">
</head>
<body class="site-xunren">

<header class="xunren-head">
  <h1>聯絡站長</h1>
  <div class="sub">協尋林晞・站長訊息帳號</div>
</header>

<main class="container">
  <section class="panel" style="text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:#2b4d7e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;font-weight:600;">周</div>
    <p style="font-weight:600;font-size:16px;margin:0;">周妤</p>
    <p style="font-size:13px;color:#666;margin:4px 0 0;">本站站長・林晞同班同學</p>
    <p style="font-size:14px;margin-top:16px;line-height:1.7;">公告如果哪裡寫錯了,或你有任何相關線索,加我好友直接傳訊息告訴我,我看到會盡快確認、回覆。</p>
    <button type="button" class="btn" id="add-friend-btn" style="margin-top:16px;">加好友</button>
    <p id="add-friend-done" style="display:none;color:#2c5b3f;font-size:13px;margin-top:12px;">已加入好友,之後可以在訊息裡找到她。</p>
  </section>

  <p style="text-align:center;margin-top:20px;">
    <a href="home.html">← 回協尋站首頁</a>
  </p>
</main>

<script src="assets/js/state.js"></script>
<script src="assets/js/entry-warning.js"></script>
<script src="assets/js/chapter-guard.js"></script>
<script src="assets/js/t2s-map.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/browser-chrome.js"></script>
<script src="assets/js/notebook.js"></script>
<script src="assets/js/hint.js"></script>
<script src="assets/js/ambient.js"></script>
<script>
const addBtn = document.getElementById("add-friend-btn");
const addDone = document.getElementById("add-friend-done");

function showAdded() {
  addBtn.style.display = "none";
  addDone.style.display = "block";
}

// 重新整理/重訪這頁,如果之前已經加過好友,直接顯示已完成狀態,不用
// 再點一次。
if (JH.get("zy_friend_added")) showAdded();

addBtn.addEventListener("click", () => {
  JHPhone.addZYFriend();
  showAdded();
});
</script>
</body>
</html>
