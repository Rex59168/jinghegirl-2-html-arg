<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>協尋志工登錄｜社團法人臺灣失蹤兒少協尋關懷基金會</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/endgame.css">
</head>
<body>

<div id="content-warning" class="content-warning" hidden>
  <div class="content-warning__box">
    <h1 class="content-warning__title"></h1>
    <p class="content-warning__body"></p>
    <button type="button" class="content-warning__continue"></button>
    <div class="lang-switcher" id="lang-switcher-warning"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="site-header">
    <span class="site-header__name"></span>
    <a class="site-header__donate" href="javascript:void(0)"></a>
  </header>
  <nav class="site-nav" id="site-nav"></nav>
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <main id="main"></main>
  <div class="lang-switcher" id="lang-switcher"></div>
  <footer class="site-footer" id="site-footer"></footer>
</div>

<script type="module">
  import { store } from './scripts/store.js';
  import * as guard from './scripts/guard.js';
  import * as chrome from './scripts/chrome.js';
  import { renderIntro, homeCrumb } from './scripts/render.js';
  import { LABELS } from './scripts/labels.js';
  import { t } from './scripts/i18n.js';

  const PAGE = {
    title: { "zh-Hant": "協尋志工登錄", "zh-Hans": "协寻志工登录", en: "Volunteer Sign-in" },
    fields: [
      { id: "nickname", label: { "zh-Hant": "顯示名稱", "zh-Hans": "显示名称", en: "Display Name" }, maxlength: 20 },
      { id: "howYouKnew", label: { "zh-Hant": "你是怎麼知道這件事的？", "zh-Hans": "你是怎么知道这件事的？", en: "How did you hear about this?" }, type: "textarea", maxlength: 200 }
    ],
    submit: { "zh-Hant": "送出登錄", "zh-Hans": "送出登录", en: "Submit" },
    note: { "zh-Hant": "本表單資料僅儲存於您的裝置。", "zh-Hans": "本表单资料仅储存于您的装置。", en: "This form's data is stored only on your device." }
  };

  guard.enter({ isIntro: true }, () => {
    chrome.mount({ breadcrumb: [homeCrumb(store.get('locale')), t(LABELS.introBreadcrumb, store.get('locale'))] });

    function render() {
      const node = renderIntro(PAGE, store.get('locale'), (data) => {
        store.set('nickname', data.nickname);
        store.set('howYouKnew', data.howYouKnew);
        location.href = 'index.html';
      });
      document.getElementById('main').replaceChildren(node);
    }
    render();
    chrome.onLocaleChange(render);
  });
</script>
</body>
</html>
