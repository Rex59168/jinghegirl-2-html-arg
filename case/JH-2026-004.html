<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>JH-2026-004｜尋人資料庫｜社團法人臺灣失蹤兒少協尋關懷基金會</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/endgame.css">
</head>
<body>

<div id="content-warning" class="content-warning" hidden>
  <div class="content-warning__box">
    <h1 class="content-warning__title"></h1>
    <p class="content-warning__body"></p>
    <button type="button" class="content-warning__continue"></button>
    <div class="lang-switcher" id="lang-switcher-warning"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="site-header">
    <span class="site-header__name"></span>
    <a class="site-header__donate" href="javascript:void(0)"></a>
  </header>
  <nav class="site-nav" id="site-nav"></nav>
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <main id="main"></main>
  <div class="lang-switcher" id="lang-switcher"></div>
  <footer class="site-footer" id="site-footer"></footer>
</div>

<script type="module">
  import { store } from './scripts/store.js';
  import * as guard from './scripts/guard.js';
  import * as chrome from './scripts/chrome.js';
  import { renderCaseDetail, homeCrumb } from './scripts/render.js';
  import { LABELS, STATUS_VALUES } from './scripts/labels.js';
  import { t } from './scripts/i18n.js';
  import * as flags from './scripts/flags.js';
  import * as notebook from './scripts/notebook.js';

  const CASE = {
    id: "JH-2026-004",
    name: "陳語安",
    age: 16,
    missing: "2026/08/26",
    lastSeen: { "zh-Hant": "靖河市河東區", "zh-Hans": "靖河市河东区", en: "Jinghe City, Hedong District" },
    status: "協尋中",
    summary: { "zh-Hant": "當日 06:40 離家後失去聯繫。", "zh-Hans": "当日 06:40 离家后失去联系。", en: "Left home at 06:40 that day and has not been in contact since." },
    summaryRevised: { "zh-Hant": "經 2026/09/04 取得之雲端備份紀錄佐證，確認當日 06:40 離家，最後一次留下紀錄為 07:14。", "zh-Hans": "经 2026/09/04 取得之云端备份记录佐证，确认当日 06:40 离家，最后一次留下记录为 07:14。", en: "Confirmed by cloud-backup records obtained 2026/09/04: she left home at 06:40 that day, and her last recorded activity was at 07:14." },
    photoNote: { "zh-Hant": "證件照掃描，畫質不佳", "zh-Hans": "证件照扫描，画质不佳", en: "Scanned ID photo, poor quality" },
    note: { "zh-Hant": "報案後九天，初步研判為自行離家。", "zh-Hans": "报案后九天，初步研判为自行离家。", en: "Nine days after the report was filed, the preliminary assessment was voluntary departure." },
  };

  const REVISED_FACT = { "zh-Hant": "JH-2026-004 摘要已修正：最後一次留下紀錄為 07:14。", "zh-Hans": "JH-2026-004 摘要已修正：最后一次留下记录为 07:14。", en: "JH-2026-004's summary was revised: her last recorded activity was at 07:14." };

  guard.enter({}, () => {
    chrome.mount({ breadcrumb: [homeCrumb(store.get('locale')), t(LABELS.breadcrumbDb, store.get('locale')), CASE.id] });

    function render() {
      document.getElementById('main').replaceChildren(renderCaseDetail(CASE, store.get('locale')));
      const statusKey = CASE.id === 'JH-2025-003' && flags.isMidUpdateFired() ? CASE.statusAfterMidUpdate : CASE.status;
      notebook.addFact('case-' + CASE.id, CASE.name + '（' + CASE.id + '）　' + CASE.missing + '　' + t(STATUS_VALUES[statusKey], store.get('locale')), 'case/' + CASE.id + '.html');
      if (flags.isSecondUpdateFired()) {
        notebook.addFact('case-revised-' + CASE.id, t(REVISED_FACT, store.get('locale')), 'case/' + CASE.id + '.html');
      }
    }
    render();
    chrome.onLocaleChange(render);
  });
</script>
</body>
</html>
