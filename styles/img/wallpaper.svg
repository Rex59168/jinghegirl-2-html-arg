<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="45%" stop-color="#131a2e"/>
      <stop offset="75%" stop-color="#1c2440"/>
      <stop offset="100%" stop-color="#242c4a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151b30"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9dff2" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#9aa4c8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9aa4c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2440" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="390" height="844" fill="url(#sky)"/>
  <circle cx="300" cy="130" r="120" fill="url(#moon)"/>
  <circle cx="300" cy="130" r="34" fill="#e7ebf7" opacity="0.5"/>

  <!-- stars -->
  <g fill="#e7ebf7" opacity="0.55">
    <circle cx="40" cy="70" r="1.2"/>
    <circle cx="90" cy="40" r="1"/>
    <circle cx="150" cy="90" r="1.4"/>
    <circle cx="200" cy="50" r="1"/>
    <circle cx="60" cy="150" r="1"/>
    <circle cx="330" cy="60" r="1.2"/>
    <circle cx="370" cy="110" r="1"/>
    <circle cx="20" cy="200" r="1"/>
    <circle cx="250" cy="30" r="1"/>
  </g>

  <!-- far skyline -->
  <g fill="#151c33">
    <rect x="0" y="360" width="30" height="140"/>
    <rect x="34" y="330" width="22" height="170"/>
    <rect x="60" y="380" width="34" height="120"/>
    <rect x="98" y="350" width="26" height="150"/>
    <rect x="128" y="390" width="40" height="110"/>
    <rect x="172" y="320" width="24" height="180"/>
    <rect x="200" y="360" width="30" height="140"/>
    <rect x="234" y="340" width="22" height="160"/>
    <rect x="260" y="385" width="36" height="115"/>
    <rect x="300" y="355" width="26" height="145"/>
    <rect x="330" y="375" width="30" height="125"/>
    <rect x="364" y="345" width="26" height="155"/>
  </g>

  <!-- near skyline, taller, with a few lit windows -->
  <g fill="#0d1122">
    <rect x="-10" y="420" width="46" height="220"/>
    <rect x="40" y="390" width="34" height="250"/>
    <rect x="78" y="440" width="50" height="200"/>
    <rect x="132" y="400" width="30" height="240"/>
    <rect x="166" y="430" width="46" height="210"/>
    <rect x="216" y="380" width="28" height="260"/>
    <rect x="248" y="420" width="42" height="220"/>
    <rect x="294" y="405" width="32" height="235"/>
    <rect x="330" y="435" width="60" height="205"/>
  </g>
  <g fill="#e8c987" opacity="0.55">
    <rect x="48" y="420" width="4" height="6"/>
    <rect x="58" y="460" width="4" height="6"/>
    <rect x="50" y="500" width="4" height="6"/>
    <rect x="88" y="470" width="4" height="6"/>
    <rect x="100" y="510" width="4" height="6"/>
    <rect x="140" y="440" width="4" height="6"/>
    <rect x="150" y="480" width="4" height="6"/>
    <rect x="176" y="460" width="4" height="6"/>
    <rect x="196" y="500" width="4" height="6"/>
    <rect x="224" y="420" width="4" height="6"/>
    <rect x="256" y="450" width="4" height="6"/>
    <rect x="268" y="490" width="4" height="6"/>
    <rect x="300" y="440" width="4" height="6"/>
    <rect x="312" y="480" width="4" height="6"/>
    <rect x="340" y="460" width="4" height="6"/>
    <rect x="360" y="500" width="4" height="6"/>
  </g>

  <!-- river with light reflections -->
  <rect x="0" y="640" width="390" height="204" fill="url(#river)"/>
  <g stroke="#e8c987" stroke-width="2" opacity="0.18">
    <line x1="50" y1="660" x2="50" y2="720"/>
    <line x1="150" y1="655" x2="150" y2="730"/>
    <line x1="260" y1="662" x2="260" y2="718"/>
    <line x1="340" y1="658" x2="340" y2="725"/>
  </g>
  <g stroke="#9aa4c8" stroke-width="1" opacity="0.12">
    <line x1="0" y1="670" x2="390" y2="670"/>
    <line x1="0" y1="700" x2="390" y2="700"/>
    <line x1="0" y1="740" x2="390" y2="740"/>
    <line x1="0" y1="780" x2="390" y2="780"/>
  </g>

  <rect width="390" height="844" fill="url(#fog)"/>
</svg>
